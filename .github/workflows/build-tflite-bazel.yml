name: Build TFLite no-XNNPACK (Bazel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl python3 python3-pip

      - name: Install Bazelisk
        run: |
          wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazelisk
          sudo ln -sfn /usr/local/bin/bazelisk /usr/local/bin/bazel

      - name: Clone TensorFlow v2.17.1
        run: |
          git clone --depth=1 --branch v2.17.1 https://github.com/tensorflow/tensorflow.git

      - name: Pre-fetch XNNPACK so we can patch it
        run: |
          cd tensorflow
          # Run a dummy fetch to download external deps including XNNPACK
          bazelisk fetch //tensorflow/lite/c:libtensorflowlite_c.so 2>/dev/null || true
          # Find XNNPACK location
          XNNPACK_DIR=$(find ~/.cache/bazel -name "BUILD.bazel" -path "*/XNNPACK/*" 2>/dev/null | head -1 | xargs dirname)
          echo "XNNPACK dir: $XNNPACK_DIR"
          if [ -n "$XNNPACK_DIR" ]; then
            # Remove all AVX512 targets from XNNPACK BUILD file
            sed -i '/avx512/d' "$XNNPACK_DIR/BUILD.bazel"
            echo "Patched XNNPACK BUILD.bazel"
          fi

      - name: Build TFLite C library without XNNPACK
        run: |
          cd tensorflow
          bazelisk build \
            -c opt \
            --copt=-O2 \
            --copt=-march=k8 \
            --copt=-mno-avx \
            --copt=-mno-avx2 \
            --copt=-mno-sse4.1 \
            --copt=-mno-sse4.2 \
            --define=tflite_enable_xnnpack=false \
            --define=no_tensorflow_py_deps=true \
            --strip=always \
            //tensorflow/lite/c:libtensorflowlite_c.so
          echo "Build complete"
          ls -lh bazel-bin/tensorflow/lite/c/libtensorflowlite_c.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libtensorflowlite_c-no-xnnpack
          path: tensorflow/bazel-bin/tensorflow/lite/c/libtensorflowlite_c.so
