name: Build TFLite no-XNNPACK (Bazel)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl python3 python3-pip
      - name: Install Bazelisk
        run: |
          wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazelisk
          sudo ln -sfn /usr/local/bin/bazelisk /usr/local/bin/bazel
      - name: Clone TensorFlow v2.17.1
        run: |
          git clone --depth=1 --branch v2.17.1 https://github.com/tensorflow/tensorflow.git
      - name: Patch TFLite to disable XNNPACK
        run: |
          cd tensorflow
          sed -i 's/tflite_with_xnnpack_default_enabled = True/tflite_with_xnnpack_default_enabled = False/' \
            tensorflow/lite/BUILD 2>/dev/null || true
      - name: Find where AVX flags live in Ruy
        run: |
          cd tensorflow
          bazelisk fetch //tensorflow/lite/c:libtensorflowlite_c.so || true
          RUY_SRC=$(find ~/.cache/bazel/ -path "*/external/ruy" -type d | head -1)
          echo "=== Ruy directory structure ==="
          find "$RUY_SRC/ruy" -maxdepth 1 -name '*.bzl' -o -name 'BUILD' -o -name '*.bazel' | sort
          echo ""
          echo "=== Searching all Ruy files for mavx ==="
          grep -rn "mavx\|avx\|mfma\|sse4" "$RUY_SRC/ruy/" --include='*.bzl' --include='BUILD' --include='*.bazel' | head -40
          echo ""
          echo "=== Content of kernel_avx target in BUILD ==="
          sed -n '/kernel_avx/,/^)/p' "$RUY_SRC/ruy/BUILD" | head -30
          echo ""
          echo "=== Searching for copts in BUILD ==="
          grep -n "copts" "$RUY_SRC/ruy/BUILD" | head -20
          echo ""
          echo "=== Any .bzl files with copts ==="
          grep -rn "copts\|mavx\|mfma" "$RUY_SRC/ruy/" --include='*.bzl' | head -20
      - name: Upload placeholder
        run: echo "Diagnostic run only"
