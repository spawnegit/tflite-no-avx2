name: Build BirdNET-Go no-AVX2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl unzip

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone BirdNET-Go
        run: |
          git clone --depth=1 https://github.com/tphakala/birdnet-go.git
          cd birdnet-go
          echo "BirdNET-Go version: $(git rev-parse --short HEAD)"

      - name: Build frontend
        run: |
          cd birdnet-go/frontend
          npm install
          npm run build

      - name: Download TFLite headers (sparse checkout of headers only)
        run: |
          git clone --depth=1 --branch v2.17.0 \
            --filter=blob:none \
            https://github.com/tensorflow/tensorflow.git /tmp/tensorflow
          cd /tmp/tensorflow
          git sparse-checkout init --cone
          git sparse-checkout set tensorflow/lite
          git checkout
          sudo mkdir -p /usr/local/include
          sudo cp -r /tmp/tensorflow/tensorflow /usr/local/include/
          echo "Headers installed:"
          find /usr/local/include/tensorflow/lite -name "*.h" | head -20

      - name: Download TFLite library
        run: |
          TFLITE_VERSION="v2.17.1"
          wget -q https://github.com/tphakala/tflite_c/releases/download/${TFLITE_VERSION}/tflite_c_${TFLITE_VERSION}_linux_amd64.tar.gz
          tar -xzf tflite_c_${TFLITE_VERSION}_linux_amd64.tar.gz
          sudo cp libtensorflowlite_c.so.2.17.1 /usr/lib/
          sudo ln -sfn /usr/lib/libtensorflowlite_c.so.2.17.1 /usr/lib/libtensorflowlite_c.so.2
          sudo ln -sfn /usr/lib/libtensorflowlite_c.so.2 /usr/lib/libtensorflowlite_c.so
          sudo ldconfig

      - name: Download and install ONNX Runtime
        run: |
          ORT_VERSION="1.24.4"
          wget -q "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar -xzf "onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          sudo cp onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so.${ORT_VERSION} /usr/lib/
          sudo ln -sfn /usr/lib/libonnxruntime.so.${ORT_VERSION} /usr/lib/libonnxruntime.so.1
          sudo ln -sfn /usr/lib/libonnxruntime.so.1 /usr/lib/libonnxruntime.so
          sudo cp -r onnxruntime-linux-x64-${ORT_VERSION}/include/* /usr/local/include/
          sudo ldconfig

      - name: Build BirdNET-Go with ONNX backend
        run: |
          cd birdnet-go
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I/usr/local/include" \
          CGO_LDFLAGS="-L/usr/lib -lonnxruntime -ltensorflowlite_c" \
          go build -tags onnx \
            -ldflags="-s -w" \
            -o birdnet-go-onnx \
            .
          echo "Build successful, binary size: $(du -sh birdnet-go-onnx)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: birdnet-go-onnx-amd64
          path: birdnet-go/birdnet-go-onnx
