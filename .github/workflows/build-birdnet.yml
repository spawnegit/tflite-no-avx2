name: Build BirdNET-Go no-AVX2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl unzip

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone BirdNET-Go
        run: |
          git clone --depth=1 https://github.com/tphakala/birdnet-go.git
          cd birdnet-go
          echo "BirdNET-Go version: $(git rev-parse --short HEAD)"

      - name: Build frontend
        run: |
          cd birdnet-go/frontend
          npm install
          npm run build

      - name: Download TFLite library and headers
        run: |
          TFLITE_VERSION="v2.17.1"
          wget -q https://github.com/tphakala/tflite_c/releases/download/${TFLITE_VERSION}/tflite_c_${TFLITE_VERSION}_linux_amd64.tar.gz
          tar -xzf tflite_c_${TFLITE_VERSION}_linux_amd64.tar.gz
          sudo cp libtensorflowlite_c.so.2.17.1 /usr/lib/
          sudo ln -sfn /usr/lib/libtensorflowlite_c.so.2.17.1 /usr/lib/libtensorflowlite_c.so.2
          sudo ln -sfn /usr/lib/libtensorflowlite_c.so.2 /usr/lib/libtensorflowlite_c.so
          sudo ldconfig
          # Download TFLite headers directly from the tphakala/tflite_c release
          wget -q https://github.com/tphakala/tflite_c/releases/download/${TFLITE_VERSION}/tflite_c_${TFLITE_VERSION}_linux_amd64.tar.gz -O tflite_headers.tar.gz || true
          # Get headers from tensorflow directly via a minimal download
          wget -q "https://raw.githubusercontent.com/tensorflow/tensorflow/v2.17.0/tensorflow/lite/c/c_api.h" -P /tmp/tflite_headers/tensorflow/lite/c/
          wget -q "https://raw.githubusercontent.com/tensorflow/tensorflow/v2.17.0/tensorflow/lite/c/c_api_types.h" -P /tmp/tflite_headers/tensorflow/lite/c/
          wget -q "https://raw.githubusercontent.com/tensorflow/tensorflow/v2.17.0/tensorflow/lite/c/c_api_experimental.h" -P /tmp/tflite_headers/tensorflow/lite/c/
          wget -q "https://raw.githubusercontent.com/tensorflow/tensorflow/v2.17.0/tensorflow/lite/c/common.h" -P /tmp/tflite_headers/tensorflow/lite/c/
          wget -q "https://raw.githubusercontent.com/tensorflow/tensorflow/v2.17.0/tensorflow/lite/core/c/c_api.h" -P /tmp/tflite_headers/tensorflow/lite/core/c/ || true
          wget -q "https://raw.githubusercontent.com/tensorflow/tensorflow/v2.17.0/tensorflow/lite/core/c/c_api_types.h" -P /tmp/tflite_headers/tensorflow/lite/core/c/ || true
          wget -q "https://raw.githubusercontent.com/tensorflow/tensorflow/v2.17.0/tensorflow/lite/core/c/common.h" -P /tmp/tflite_headers/tensorflow/lite/core/c/ || true
          sudo cp -r /tmp/tflite_headers/* /usr/local/include/
          echo "TFLite headers:"
          find /usr/local/include/tensorflow -name "*.h" 2>/dev/null

      - name: Download and install ONNX Runtime
        run: |
          ORT_VERSION="1.24.4"
          wget -q "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar -xzf "onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          sudo cp onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so.${ORT_VERSION} /usr/lib/
          sudo ln -sfn /usr/lib/libonnxruntime.so.${ORT_VERSION} /usr/lib/libonnxruntime.so.1
          sudo ln -sfn /usr/lib/libonnxruntime.so.1 /usr/lib/libonnxruntime.so
          sudo cp -r onnxruntime-linux-x64-${ORT_VERSION}/include/* /usr/local/include/
          sudo ldconfig

      - name: Download go module cache to find tflite header path
        run: |
          cd birdnet-go
          go mod download github.com/tphakala/go-tflite
          TFLITE_GO_PATH=$(go env GOPATH)/pkg/mod/github.com/tphakala/go-tflite@v0.2.2-0.20260514101223-29408e53fff7
          echo "go-tflite path: $TFLITE_GO_PATH"
          ls $TFLITE_GO_PATH/

      - name: Build BirdNET-Go with ONNX backend
        run: |
          cd birdnet-go
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I/usr/local/include" \
          CGO_LDFLAGS="-L/usr/lib -lonnxruntime -ltensorflowlite_c" \
          go build -tags onnx \
            -ldflags="-s -w" \
            -o birdnet-go-onnx \
            .
          echo "Build successful, binary size: $(du -sh birdnet-go-onnx)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: birdnet-go-onnx-amd64
          path: birdnet-go/birdnet-go-onnx
